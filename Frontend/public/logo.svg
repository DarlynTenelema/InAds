<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Clean white background -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  
  <!-- Subtle minimalist rounded container -->
  <rect x="2" y="2" width="508" height="508" rx="100" fill="none" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Main Composition: Typography Group -->
  <!-- "Ads" in the background (Gray #94A3B8) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800">
    
    <!-- Background: "Ads" in elegant slate gray -->
    <text x="256" y="340" text-anchor="middle" font-size="240" fill="#94A3B8" letter-spacing="-6px">Ads</text>

    <!-- Foreground Overlays with clean white cutout mask -->
    <!-- 1. The letter 'i' nestled in the 'A' -->
    <!-- White cutout for 'i' -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <rect x="127" y="235" width="26" height="100" rx="6" />
      <circle cx="140" cy="192" r="19" />
    </g>

    <!-- 'i' stem in Solid Black #0F172A -->
    <rect x="127" y="235" width="26" height="100" rx="6" fill="#0F172A"/>

    <!-- 'i' dot in Brand Electric Blue #2563EB -->
    <circle cx="140" cy="192" r="19" fill="#2563EB"/>

    <!-- 2. The letter 'n' superimposed over the bowl of 'd' -->
    <!-- White cutout for 'n' -->
    <text x="282" y="346" font-size="185" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">n</text>
    
    <!-- 'n' in Solid Black #0F172A -->
    <text x="282" y="346" font-size="185" fill="#0F172A">n</text>

  </g>
</svg>
